    <link rel="manifest" href="/manifest.webmanifest" />

    <div id="appSplash" aria-label="Loading ZenGrid Solar"><img src="/quote-assets/gst-logo.jpeg" alt="Zengrid Solar"><span>ZenGrid Solar</span></div>
